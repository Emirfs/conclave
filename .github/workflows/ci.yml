name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: Yayın derlemesi tutuyor mu
        # A release stamps the version in with -ldflags. If that path only ever
        # runs on a tag, it breaks on the day it matters.
        run: go build -trimpath -ldflags "-X github.com/Emirfs/conclave/internal/version.Version=0.0.0-ci" ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/conclave-desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
