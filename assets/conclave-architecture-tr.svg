<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Conclave sistem mimarisi</title>
  <desc id="desc">Masaüstü ve komut satırı istemcileri kimlik doğrulamalı yerel API ile iletişim kurar. Daemon SQLite, sağlayıcı CLI'ları, proje dizinleri ve Git incelemesini yönetir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151a2d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#8294b8"/></marker>
    <style>.title{font:700 28px Inter,Segoe UI,sans-serif;fill:#f5f7ff}.sub{font:14px Inter,Segoe UI,sans-serif;fill:#8d9ab8}.head{font:700 17px Inter,Segoe UI,sans-serif;fill:#f5f7ff}.text{font:13px Inter,Segoe UI,sans-serif;fill:#b9c3da}.small{font:12px Inter,Segoe UI,sans-serif;fill:#8290ad}.box{stroke-width:1.5;rx:14;filter:url(#shadow)}.line{fill:none;stroke:#8294b8;stroke-width:2;marker-end:url(#arrow)}.tag{font:700 11px Inter,Segoe UI,sans-serif;letter-spacing:1px}</style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Conclave mimarisi</text><text x="60" y="84" class="sub">Masaüstü, terminal, sağlayıcılar ve projeler için tek kalıcı yerel kontrol katmanı</text>
  <rect x="50" y="125" width="235" height="150" class="box" fill="#17223b" stroke="#4c73b8"/><text x="72" y="155" class="tag" fill="#7eaeff">İSTEMCİLER</text><text x="72" y="190" class="head">Wails masaüstü</text><text x="72" y="212" class="text">React Flow canvas</text><text x="72" y="243" class="head">conclave CLI</text><text x="72" y="265" class="text">status · chat · run</text>
  <rect x="365" y="125" width="270" height="150" class="box" fill="#1a2638" stroke="#45a6a1"/><text x="387" y="155" class="tag" fill="#69d6ce">YEREL SINIR</text><text x="387" y="190" class="head">Kimlik doğrulamalı HTTP API</text><text x="387" y="216" class="text">127.0.0.1:7331 · /v1</text><text x="387" y="241" class="text">Bearer token · browser Origin yok</text><text x="387" y="263" class="small">Frontend yalnızca Go binding ile erişir</text>
  <rect x="715" y="105" width="430" height="190" class="box" fill="#211f38" stroke="#8d72d9"/><text x="739" y="137" class="tag" fill="#ba9cff">DAEMON</text><text x="739" y="173" class="head">Sınırlandırılmış worker havuzları</text><text x="739" y="199" class="text">Sohbet işleri · sıralı pipeline · kurtarma</text><text x="739" y="234" class="head">Sağlayıcı adaptörleri</text><text x="739" y="260" class="text">Keşif · doğrudan argüman · akış çözümleme</text><text x="739" y="282" class="small">Oturum, etkinlik, kota, zaman aşımı ve çıktı sınırı</text>
  <path d="M285 200H365" class="line"/><text x="303" y="188" class="small">Wails / JSON</text><path d="M635 200H715" class="line"/><text x="650" y="188" class="small">işler</text>
  <rect x="55" y="370" width="270" height="180" class="box" fill="#202530" stroke="#77849e"/><text x="78" y="402" class="tag" fill="#abb7cc">KALICILIK</text><text x="78" y="438" class="head">SQLite state.sqlite</text><text x="78" y="466" class="text">Konuşma · canvas · bağlantı</text><text x="78" y="489" class="text">Oturum · kota · pipeline</text><text x="78" y="520" class="small">Sona eklenen migration ve yeniden başlatma kurtarması</text>
  <rect x="430" y="370" width="315" height="180" class="box" fill="#30241b" stroke="#d38b43"/><text x="454" y="402" class="tag" fill="#ffb466">SAĞLAYICI SÜREÇLERİ</text><text x="454" y="438" class="head">Claude · Codex · Antigravity</text><text x="454" y="464" class="head">Ollama</text><text x="454" y="493" class="text">Resmî yerel CLI ve kimlik bilgileri</text><text x="454" y="520" class="small">Yapılandırılmış akış yanıt ve oturum döndürür</text>
  <rect x="850" y="370" width="295" height="180" class="box" fill="#1d3029" stroke="#4ea875"/><text x="874" y="402" class="tag" fill="#6ed69a">PROJELER</text><text x="874" y="438" class="head">Kart çalışma dizini</text><text x="874" y="466" class="text">read veya edit erişimi</text><text x="874" y="493" class="head">Git incelemesi</text><text x="874" y="520" class="small">Durum ve unified diff salt okunurdur</text>
  <path d="M810 295V330H325V370" class="line"/><path d="M890 295V340H590V370" class="line"/><path d="M1010 295V370" class="line"/><path d="M745 460H850" class="line"/><text x="761" y="448" class="small">içinde çalışır</text>
  <rect x="50" y="590" width="1095" height="1" fill="#29324a"/><text x="60" y="620" class="small">Güvenlik değişmezi: Kimlik bilgileri sağlayıcı CLI'larında kalır; tarayıcı katmanı daemon token'ını görmez.</text>
</svg>
