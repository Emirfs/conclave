<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Conclave mesaj işleme akışı</title><desc id="desc">Kullanıcı mesajı doğrulanır, saklanır, worker tarafından alınır, sağlayıcı CLI ile çalıştırılır, SQLite'a canlı yazılır ve gösterilir veya aktarılır.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1120"/><stop offset="1" stop-color="#171629"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#7e91b6"/></marker><style>.title{font:700 27px Inter,Segoe UI,sans-serif;fill:#f5f7ff}.sub{font:14px Inter,Segoe UI,sans-serif;fill:#8e9bb7}.num{font:700 13px Inter,Segoe UI,sans-serif;fill:#0d1321}.head{font:700 15px Inter,Segoe UI,sans-serif;fill:#f5f7ff}.text{font:12px Inter,Segoe UI,sans-serif;fill:#aebad2}.box{rx:14;stroke-width:1.5;filter:url(#shadow)}.line{fill:none;stroke:#7e91b6;stroke-width:2;marker-end:url(#arrow)}.loop{fill:none;stroke:#b783e6;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg)"/><text x="55" y="55" class="title">Prompt'tan kalıcı yanıta</text><text x="55" y="80" class="sub">Arayüz işi gönderir; yaşam döngüsünün tamamına daemon sahip olur.</text>
  <g transform="translate(45 140)"><rect width="165" height="135" class="box" fill="#18243c" stroke="#4f77bb"/><circle cx="27" cy="27" r="14" fill="#91b7ff"/><text x="23" y="32" class="num">1</text><text x="20" y="64" class="head">Gönder</text><text x="20" y="88" class="text">Masaüstü veya CLI</text><text x="20" y="106" class="text">yerel API'ye mesaj yollar</text></g>
  <g transform="translate(235 140)"><rect width="165" height="135" class="box" fill="#182d35" stroke="#47a8a2"/><circle cx="27" cy="27" r="14" fill="#6ad8cf"/><text x="23" y="32" class="num">2</text><text x="20" y="64" class="head">Doğrula</text><text x="20" y="88" class="text">Token, yük, sağlayıcı</text><text x="20" y="106" class="text">ve proje denetlenir</text></g>
  <g transform="translate(425 140)"><rect width="165" height="135" class="box" fill="#292437" stroke="#9474d1"/><circle cx="27" cy="27" r="14" fill="#c1a0ff"/><text x="23" y="32" class="num">3</text><text x="20" y="64" class="head">Sakla</text><text x="20" y="88" class="text">SQLite mesajı ve yanıt</text><text x="20" y="106" class="text">kuyruklarını kaydeder</text></g>
  <g transform="translate(615 140)"><rect width="165" height="135" class="box" fill="#30261c" stroke="#d38a43"/><circle cx="27" cy="27" r="14" fill="#ffb46c"/><text x="23" y="32" class="num">4</text><text x="20" y="64" class="head">Çalıştır</text><text x="20" y="88" class="text">Worker sağlayıcı CLI'ını</text><text x="20" y="106" class="text">kart dizininde çalıştırır</text></g>
  <g transform="translate(805 140)"><rect width="165" height="135" class="box" fill="#203129" stroke="#51a777"/><circle cx="27" cy="27" r="14" fill="#72d89d"/><text x="23" y="32" class="num">5</text><text x="20" y="64" class="head">Canlı aktar</text><text x="20" y="88" class="text">Metin ve etkinlik kalıcı</text><text x="20" y="106" class="text">durumu anlık günceller</text></g>
  <g transform="translate(995 140)"><rect width="165" height="135" class="box" fill="#282338" stroke="#b77bd7"/><circle cx="27" cy="27" r="14" fill="#dc9cff"/><text x="23" y="32" class="num">6</text><text x="20" y="64" class="head">Göster veya aktar</text><text x="20" y="88" class="text">İstemci sonucu okur;</text><text x="20" y="106" class="text">bağlı kart devam ettirir</text></g>
  <path d="M210 208H235M400 208H425M590 208H615M780 208H805M970 208H995" class="line"/><path d="M1078 275V350H508V277" class="loop"/><text x="690" y="374" class="sub">Canvas bağlantısı, sınırlı aktarım derinliğiyle yeni bir kalıcı mesaj oluşturur</text>
</svg>
